apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Keep the incident resource name so applying this manifest updates it in
  # place instead of creating competing Ingress rules for the same paths.
  name: frontend-problem-rate-limit
  namespace: omegaup
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($http_user_agent ~* "(Applebot|bingbot|Bytespider|OAI-SearchBot|Amazonbot|PetalBot|SemrushBot)") {
        return 429;
      }
spec:
  rules:
  - host: omegaup.com
    http:
      paths:
      - path: /problem/
        pathType: Exact
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
      - path: /problem/list/
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
      - path: /problem/collection/
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
      - path: /api/problem/list/
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
  - host: www.omegaup.com
    http:
      paths:
      - path: /problem/
        pathType: Exact
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
      - path: /problem/list/
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
      - path: /problem/collection/
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
      - path: /api/problem/list/
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
  - host: arena.omegaup.com
    http:
      paths:
      - path: /problem/
        pathType: Exact
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
      - path: /problem/list/
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
      - path: /problem/collection/
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
      - path: /api/problem/list/
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
